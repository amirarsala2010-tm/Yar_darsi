<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<title>یار درسی</title>
<style>
:root{--bg:#0f172a;--card:#1e293b;--card2:#273449;--tx:#f1f5f9;--mut:#94a3b8;--pri:#6366f1;--pri2:#8b5cf6;--ok:#22c55e;--bad:#ef4444;--warn:#f59e0b;--bd:#334155}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:Vazirmatn,Tahoma,"Segoe UI",system-ui,sans-serif;font-size:15px;line-height:1.7}
body{padding-bottom:calc(72px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top));background:linear-gradient(135deg,#4f46e5,#7c3aed);box-shadow:0 2px 12px #0006}
header h1{flex:1;margin:0;font-size:18px}
header button{background:#ffffff26;border:0;color:#fff;border-radius:12px;padding:6px 10px;font-size:18px}
main{padding:14px;max-width:720px;margin:auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px}
.card h3{margin:0 0 8px;font-size:16px}
.row{display:flex;gap:8px;align-items:center}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{grid-template-columns:repeat(3,1fr)}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px;text-align:center}
.stat b{display:block;font-size:20px}
.stat small,.mut{color:var(--mut);font-size:12.5px}
.btn{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;border:0;border-radius:12px;padding:10px 14px;font:inherit;font-weight:700;cursor:pointer}
.btn.sec{background:var(--card2);border:1px solid var(--bd);font-weight:500}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:10px}
.btn.full{width:100%}
.btn:disabled{opacity:.5}
.btn.red{background:#7f1d1d}
.q{display:block;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;text-align:center;color:var(--tx);font:inherit;cursor:pointer}
.q span{display:block;font-size:26px}
input,select,textarea{width:100%;background:#0f172a;color:var(--tx);border:1px solid var(--bd);border-radius:12px;padding:10px;font:inherit;margin:4px 0}
textarea{min-height:90px;resize:vertical}
label{font-size:13px;color:var(--mut)}
nav{position:fixed;bottom:0;inset-inline:0;z-index:6;display:flex;background:#111827;border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;color:var(--mut);padding:8px 2px;font:inherit;font-size:11px;cursor:pointer}
nav button span{display:block;font-size:20px}
nav button.on{color:#a5b4fc}
.msgs{display:flex;flex-direction:column;gap:8px;min-height:40vh;max-height:55vh;overflow-y:auto;padding:4px}
.m{max-width:88%;padding:9px 12px;border-radius:16px;word-wrap:break-word;overflow-wrap:anywhere}
.m.u{align-self:flex-start;background:#4338ca;border-bottom-right-radius:4px}
.m.a{align-self:flex-end;background:var(--card2);border-bottom-left-radius:4px}
.m img{max-width:100%;border-radius:10px;display:block;margin-bottom:6px}
.m pre,.out pre{direction:ltr;text-align:left;background:#0b1220;padding:8px;border-radius:8px;overflow-x:auto;white-space:pre-wrap}
code{background:#0b1220;padding:1px 5px;border-radius:5px;direction:ltr;unicode-bidi:embed}
.li{padding-inline-start:4px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chip{background:var(--card2);border:1px solid var(--bd);color:var(--tx);border-radius:999px;padding:4px 12px;font:inherit;font-size:13px;cursor:pointer}
.chip.on{background:var(--pri);border-color:var(--pri)}
.opt{display:block;width:100%;text-align:start;background:var(--card2);border:2px solid var(--bd);color:var(--tx);border-radius:12px;padding:10px;margin:6px 0;font:inherit;cursor:pointer}
.opt.sel{border-color:var(--pri);background:#312e81}
.ok{border-color:var(--ok)!important}
.no{border-color:var(--bad)!important}
.bar{height:8px;background:#0f172a;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pri),var(--pri2))}
.flash{min-height:180px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:18px;background:var(--card2);border-radius:16px;padding:16px;margin:10px 0}
.task{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--bd)}
.task:last-child{border:0}
.task input{width:22px;height:22px;margin:0}
.task.done span{text-decoration:line-through;color:var(--mut)}
.tag{display:inline-block;background:#312e81;border-radius:8px;padding:0 8px;font-size:12px;color:#c7d2fe}
.toast{position:fixed;bottom:90px;inset-inline:16px;z-index:20;background:#111827;border:1px solid var(--pri);border-radius:12px;padding:10px 14px;text-align:center;box-shadow:0 4px 20px #000a}
.ov{position:fixed;inset:0;background:#000b;z-index:15;display:flex;align-items:center;justify-content:center;padding:16px}
.ov .card{width:100%;max-width:420px;max-height:90vh;overflow:auto;margin:0}
.timer{font-size:56px;font-weight:800;text-align:center;direction:ltr;font-variant-numeric:tabular-nums}
.spin{display:inline-block;width:16px;height:16px;border:3px solid #fff5;border-top-color:#fff;border-radius:50%;animation:r .8s linear infinite;vertical-align:middle}
@keyframes r{to{transform:rotate(360deg)}}
.warn{background:#78350f;border-color:var(--warn)}
.out{background:var(--card2);border-radius:12px;padding:12px;margin-top:10px}
svg text{fill:var(--mut);font-size:11px;font-family:inherit}
</style>
</head>
<body>
<header><h1 id="ttl">📚 یار درسی</h1><button data-a="pomo" title="تایمر">⏱</button><button data-a="settings" title="تنظیمات">⚙️</button></header>
<main id="app"></main>
<nav id="nav"></nav>
<input type="file" id="file" accept="image/*" hidden>
<script>
/* ============ ابزارها ============ */
const $=(s,r=document)=>r.querySelector(s);
const fa=n=>Number(n).toLocaleString('fa-IR');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const iso=d=>d.toLocaleDateString('sv-SE');
const today=()=>iso(new Date());
const fromIso=s=>new Date(s+'T12:00:00');
const addDays=(s,n)=>{const d=fromIso(s);d.setDate(d.getDate()+n);return iso(d)};
const pf=(s,o={weekday:'long',day:'numeric',month:'long'})=>new Intl.DateTimeFormat('fa-IR-u-ca-persian',o).format(typeof s==='string'?fromIso(s):s);
const uid=()=>Math.random().toString(36).slice(2,9);
const SUBJECTS=['ریاضی ۱','هندسه ۱','فیزیک ۱','شیمی ۱','زیست‌شناسی ۱','فارسی ۱','نگارش ۱','عربی ۱','زبان انگلیسی ۱','دین و زندگی ۱','آمادگی دفاعی','سلامت و بهداشت','تفکر و سواد رسانه‌ای','کارگاه کارآفرینی و تولید'];
const subjOpts=(sel,all)=>(all?'<option value="">همه درس‌ها</option>':'')+SUBJECTS.map(s=>`<option ${s===sel?'selected':''}>${s}</option>`).join('');
function md(t){t=esc(t);t=t.replace(/```(?:\w+)?\n?([\s\S]*?)```/g,'<pre>$1</pre>').replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/^#{1,4}\s*(.+)$/gm,'<b>$1</b>').replace(/^\s*[-*•]\s+(.+)$/gm,'<div class="li">• $1</div>').replace(/\n/g,'<br>').replace(/<\/div><br>/g,'</div>');return t}
function pj(t){const a=t.search(/[\[{]/);const b=Math.max(t.lastIndexOf(']'),t.lastIndexOf('}'));if(a<0||b<a)throw new Error('پاسخ هوش مصنوعی قابل خواندن نبود، دوباره امتحان کن');return JSON.parse(t.slice(a,b+1))}
function toast(m,ms=2600){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),ms)}

/* ============ ذخیره‌سازی ============ */
const KEY='yar_darsi_v1';
const DEF={name:'',cfg:{provider:'anthropic',key:'',base:'https://api.openai.com/v1',model:'claude-sonnet-5-5'},chat:{},cards:[],exams:[],plan:[],quizzes:[],weak:{},log:{},hours:3,notify:false};
let S;
try{S=Object.assign({},DEF,JSON.parse(localStorage.getItem(KEY)||'{}'));S.cfg=Object.assign({},DEF.cfg,S.cfg)}catch(e){S=structuredClone(DEF)}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('حافظه پر است')}};

/* ============ هوش مصنوعی ============ */
const SYS=`تو «یار درسی»، معلم خصوصی مهربان و دقیق یک دانش‌آموز پایه دهم رشته ریاضی فیزیک در ایران هستی. بر اساس کتاب‌های درسی رسمی ایران پاسخ بده. فارسی ساده و دوستانه بنویس. مرحله‌به‌مرحله توضیح بده و کوتاه و مفید باش. فرمول‌ها را با متن ساده و نمادهای یونیکد بنویس (مثل x² ، √ ، ½ ، Δ ، ×) و هرگز از LaTeX یا علامت $ استفاده نکن. اگر از درستی چیزی مطمئن نیستی، صادقانه بگو.`;
async function ai(msgs,{system=SYS,max=2500}={}){
  const c=S.cfg;if(!c.key)throw new Error('NOKEY');
  if(c.provider==='anthropic'){
    const m=msgs.map(x=>({role:x.role,content:x.img?[{type:'image',source:{type:'base64',media_type:x.img.type,data:x.img.data}},{type:'text',text:x.text||'این تصویر را بررسی کن.'}]:x.text}));
    const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':c.key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:c.model,max_tokens:max,system,messages:m})});
    const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error?.message||('خطا '+r.status));
    return (j.content||[]).map(b=>b.text||'').join('');
  }
  const m=[{role:'system',content:system},...msgs.map(x=>({role:x.role,content:x.img?[{type:'text',text:x.text||'این تصویر را بررسی کن.'},{type:'image_url',image_url:{url:x.img.url}}]:x.text}))];
  const r=await fetch(c.base.replace(/\/$/,'')+'/chat/completions',{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+c.key},body:JSON.stringify({model:c.model,max_tokens:max,messages:m})});
  const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error?.message||('خطا '+r.status));
  return j.choices?.[0]?.message?.content||'';
}
const aiErr=e=>e.message==='NOKEY'?'اول از ⚙️ تنظیمات، کلید API رو وارد کن':(e.message==='Failed to fetch'?'اتصال به هوش مصنوعی برقرار نشد (اینترنت/VPN یا آدرس را بررسی کن)':e.message);
async function pickImage(){
  return new Promise(res=>{const f=$('#file');f.value='';f.onchange=()=>{const file=f.files[0];if(!file)return res(null);const img=new Image();const u=URL.createObjectURL(file);img.onload=()=>{const k=Math.min(1,1280/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=img.width*k;c.height=img.height*k;c.getContext('2d').drawImage(img,0,0,c.width,c.height);const url=c.toDataURL('image/jpeg',.82);URL.revokeObjectURL(u);res({type:'image/jpeg',data:url.split(',')[1],url})};img.src=u};f.click()});
}
const busy=(b,on)=>{if(!b)return;if(on){b.dataset.t=b.innerHTML;b.innerHTML='<span class="spin"></span>';b.disabled=true}else{b.innerHTML=b.dataset.t;b.disabled=false}};

/* ============ منطق مشترک ============ */
const addLog=m=>{const t=today();S.log[t]=(S.log[t]||0)+m;if(S.log[t]<0)S.log[t]=0};
function streak(){let n=0,d=today();if(!S.log[d])d=addDays(d,-1);while(S.log[d]>0){n++;d=addDays(d,-1)}return n}
const dueCards=()=>S.cards.filter(c=>c.due<=today());
function weakList(n=5){return Object.values(S.weak).filter(w=>w.w>0).sort((a,b)=>b.w*(b.w/b.n)-a.w*(a.w/a.n)).slice(0,n)}
function rateCard(c,r){
  if(r===1){c.ease=Math.max(1.3,c.ease-.2);c.reps=0;c.iv=1}
  else if(r===2){c.iv=c.reps===0?1:c.reps===1?3:Math.round(c.iv*c.ease);c.reps++}
  else{c.iv=Math.max(3,Math.round((c.iv||1)*c.ease*1.3));c.ease+=.1;c.reps++}
  c.due=addDays(today(),c.iv);
}

/* ============ ناوبری ============ */
const TABS=[['home','🏠','خانه'],['tutor','🧑‍🏫','معلم'],['quiz','📝','آزمون'],['cards','🃏','کارت‌ها'],['plan','📅','برنامه'],['stats','📊','آمار']];
let tab='home';
function go(t){tab=t;$('#nav').innerHTML=TABS.map(x=>`<button class="${x[0]===t||(t==='notes'&&x[0]==='home')?'on':''}" data-a="go" data-t="${x[0]}"><span>${x[1]}</span>${x[2]}</button>`).join('');$('#app').innerHTML=V[t]();if(V[t+'Init'])V[t+'Init']();scrollTo(0,0)}

/* ============ صفحات ============ */
const V={};
const noKeyBanner=()=>S.cfg.key?'':`<div class="card warn"><b>⚠️ هوش مصنوعی وصل نیست</b><div class="mut" style="color:#fde68a">برای کار کردن معلم، آزمون‌ساز و برنامه‌ریز، کلید API رو توی ⚙️ تنظیمات وارد کن.</div><button class="btn sm" style="margin-top:8px" data-a="settings">رفتن به تنظیمات</button></div>`;

V.home=()=>{
  const t=today(),tasks=S.plan.filter(p=>p.date===t),ex=S.exams.filter(e=>e.date>=t).sort((a,b)=>a.date.localeCompare(b.date))[0];
  const left=ex?Math.round((fromIso(ex.date)-fromIso(t))/864e5):0;
  return `${noKeyBanner()}
  <div class="card" style="background:linear-gradient(135deg,#312e81,#5b21b6)"><h3>سلام ${esc(S.name)||'دوست من'} 👋</h3><div>${pf(t)}</div><div>🔥 ${streak()?fa(streak())+' روز پشت‌سرهم مطالعه!':'امروز اولین مطالعه‌ت رو شروع کن'}</div></div>
  <div class="grid g3" style="margin-bottom:12px"><div class="stat"><b>${fa(S.log[t]||0)}</b><small>دقیقه امروز</small></div><div class="stat"><b>${fa(dueCards().length)}</b><small>کارت برای مرور</small></div><div class="stat"><b>${fa(tasks.filter(x=>!x.done).length)}</b><small>کار باقی‌مانده</small></div></div>
  ${ex?`<div class="card"><h3>⏳ امتحان بعدی</h3><b>${esc(ex.subject)}</b> — ${pf(ex.date)}<div class="mut">${left===0?'امروز است! موفق باشی 💪':fa(left)+' روز مانده'}</div></div>`:''}
  <div class="card"><h3>📋 برنامه امروز</h3>${tasks.length?tasks.map(taskHtml).join(''):'<div class="mut">برای امروز برنامه‌ای نداری. از تب «برنامه» بساز.</div>'}</div>
  <div class="grid"><button class="q" data-a="pomo"><span>⏱</span>تایمر تمرکز</button><button class="q" data-a="go" data-t="notes"><span>📄</span>خلاصه‌ساز جزوه</button><button class="q" data-a="weakquiz"><span>🎯</span>تمرین ضعف‌ها</button><button class="q" data-a="review"><span>🧠</span>مرور کارت‌ها</button></div>`;
};
const taskHtml=p=>`<label class="task ${p.done?'done':''}"><input type="checkbox" data-a="task" data-id="${p.id}" ${p.done?'checked':''}><span><span class="tag">${esc(p.subject)}</span> ${esc(p.topic)} <small class="mut">(${fa(p.minutes)} دقیقه)</small></span></label>`;

/* ---- معلم ---- */
let tSubj='ریاضی ۱',tImg=null;
V.tutor=()=>`${noKeyBanner()}<div class="card"><label>درس</label><select id="tsub" data-a="tsub">${subjOpts(tSubj)}</select>
<div class="msgs" id="msgs"></div><div id="timg"></div>
<div class="chips">${['ساده‌تر توضیح بده','یه مثال بزن','یه تمرین بهم بده','نکته امتحانی‌ش چیه؟'].map(c=>`<button class="chip" data-a="chip" data-v="${c}">${c}</button>`).join('')}</div>
<div class="row"><button class="btn sec" data-a="timgpick">📷</button><input id="cin" placeholder="سوالت رو بپرس..." style="margin:0"><button class="btn" data-a="send">ارسال</button></div>
<button class="btn sec sm" style="margin-top:8px" data-a="clearchat">🗑 پاک کردن گفتگوی این درس</button></div>`;
V.tutorInit=()=>{drawChat();$('#cin').addEventListener('keydown',e=>{if(e.key==='Enter')send()})};
function drawChat(){const m=S.chat[tSubj]||[];const el=$('#msgs');if(!el)return;el.innerHTML=m.length?m.map(x=>`<div class="m ${x.role==='user'?'u':'a'}">${x.img?'<img src="'+x.img+'">':''}${md(x.text)}</div>`).join(''):`<div class="mut" style="text-align:center;margin:auto">هر سوالی درباره‌ی ${esc(tSubj)} داری بپرس 🙂<br>می‌تونی عکس تمرین هم بفرستی</div>`;el.scrollTop=el.scrollHeight}
async function send(txt){
  const inp=$('#cin');const text=(txt??inp.value).trim();if(!text&&!tImg)return;if(inp)inp.value='';
  const h=S.chat[tSubj]=S.chat[tSubj]||[];const img=tImg;tImg=null;$('#timg').innerHTML='';
  h.push({role:'user',text:text||'این تصویر را بررسی کن.',img:img?img.url:null});drawChat();
  const el=$('#msgs');el.insertAdjacentHTML('beforeend','<div class="m a" id="typing"><span class="spin"></span></div>');el.scrollTop=el.scrollHeight;
  try{
    const ctx=h.slice(-12).map((x,i,a)=>({role:x.role,text:x.text,img:(x.img&&i===a.length-1&&img)?img:null}));
    const r=await ai(ctx,{system:SYS+` درس فعلی: ${tSubj}.`});
    h.push({role:'assistant',text:r});
  }catch(e){h.pop();toast(aiErr(e),4000)}
  if(S.chat[tSubj].length>40)S.chat[tSubj]=S.chat[tSubj].slice(-40);
  save();drawChat();
}

/* ---- آزمون ---- */
let Q={state:'setup'};
V.quiz=()=>{
  if(Q.state==='setup')return `${noKeyBanner()}<div class="card"><h3>📝 ساخت آزمون</h3>
  <label>درس</label><select id="qs">${subjOpts('ریاضی ۱')}</select>
  <label>مبحث (مثلاً «معادله درجه دوم» یا «حرکت‌شناسی»)</label><input id="qt" placeholder="خالی = کل کتاب">
  <label>نوع سوال</label><select id="qy"><option value="mcq">تستی</option><option value="desc">تشریحی</option><option value="fill">جای‌خالی</option><option value="mix">ترکیبی</option></select>
  <div class="grid"><div><label>سختی</label><select id="qd"><option>آسان</option><option selected>متوسط</option><option>سخت</option><option>چالشی (المپیادی)</option></select></div><div><label>تعداد</label><select id="qn"><option>5</option><option selected>8</option><option>10</option><option>15</option></select></div></div>
  <button class="btn full" style="margin-top:10px" data-a="qstart">شروع آزمون</button></div>
  ${S.quizzes.length?`<div class="card"><h3>آخرین آزمون‌ها</h3>${S.quizzes.slice(-5).reverse().map(q=>`<div class="row" style="justify-content:space-between"><span>${esc(q.subject)}</span><span class="mut">${pf(q.date,{day:'numeric',month:'short'})}</span><b>${fa(q.pct)}٪</b></div>`).join('')}</div>`:''}`;
  if(Q.state==='run'){
    const q=Q.qs[Q.i],pct=Q.i/Q.qs.length*100;
    return `<div class="card"><div class="row mut"><span>سوال ${fa(Q.i+1)} از ${fa(Q.qs.length)}</span><span style="margin-inline-start:auto">${esc(Q.subject)}</span></div><div class="bar" style="margin:6px 0 12px"><i style="width:${pct}%"></i></div>
    <div style="font-size:16px;margin-bottom:8px">${md(q.q)}</div>

  if(Q.state==='done'){
    return `<div class="card" style="text-align:center"><h3>نتیجه</h3><div style="font-size:44px;font-weight:800">${fa(Q.pct)}٪</div><div>${Q.pct>=80?'عالی بود! 🎉':Q.pct>=50?'خوبه، با مرور بهتر می‌شه 💪':'نگران نباش، از اشتباه‌ها یاد می‌گیریم 🌱'}</div></div>

const qIndex=i=>'الف،ب،ج،د'.split('،')[i];
async function startQuiz(o){
  const b=$('[data-a=qstart]');busy(b,true);
  const tm={mcq:'همه سوال‌ها تستی چهارگزینه‌ای',desc:'همه سوال‌ها تشریحی',fill:'همه سوال‌ها جای‌خالی با پاسخ کوتاه',mix:'ترکیبی از تستی، تشریحی و جای‌خالی'}[o.type];
  const prompt=`${o.count} سوال برای درس «${o.subject}» ${o.topic?'درباره: '+o.topic:'از مباحث مختلف کتاب'} بساز. سطح سختی: ${o.diff}. ${tm}. ${o.extra||''}
فقط یک آرایه JSON معتبر برگردان، بدون هیچ متن دیگر. هر عنصر:
{"type":"mcq|desc|fill","q":"متن سوال","options":["گزینه۱","گزینه۲","گزینه۳","گزینه۴"],"answer":0,"explain":"توضیح کوتاه پاسخ","topic":"نام مبحث"}
برای mcq فیلد answer شماره گزینه درست (۰ تا ۳) و options الزامی است. برای desc و fill فیلد answer متن پاسخ درست است و options نیاید. سوال‌های جای‌خالی را با ____ مشخص کن. بدون LaTeX.`;
  try{
    const r=pj(await ai([{role:'user',text:prompt}],{max:4500}));
    const qs=r.filter(x=>x&&x.q&&(x.type!=='mcq'||(Array.isArray(x.options)&&x.options.length>=2))).slice(0,o.count);
    if(!qs.length)throw new Error('سوالی ساخته نشد');
    Q={state:'run',subject:o.subject,qs,i:0,ans:[]};go('quiz');
  }catch(e){toast(aiErr(e),4500)}
  busy(b,false);
}
function qCollect(){const el=$('#qa');if(el)Q.ans[Q.i]=el.value}
async function finishQuiz(){
  Q.state='grading';go('quiz');
  const res=Q.qs.map((q,i)=>{const a=Q.ans[i];if(q.type==='mcq')return{s:a===q.answer?1:0,mine:a!=null?q.options[a]:null,correct:q.options[q.answer],fb:q.explain};return{s:0,mine:a||null,correct:q.answer,fb:q.explain,ai:true}});
  const need=res.map((r,i)=>r.ai&&r.mine&&r.mine.trim()?{i,q:Q.qs[i].q,correct:Q.qs[i].answer,student:r.mine}:null).filter(Boolean);
  if(need.length){
    try{
      const g=pj(await ai([{role:'user',text:`پاسخ دانش‌آموز را با پاسخ درست مقایسه و تصحیح کن. برای هر مورد score بین 0 تا 1 (می‌تواند 0.5 هم باشد) و یک feedback کوتاه فارسی بده. فقط آرایه JSON به این شکل برگردان: [{"i":شماره,"score":0.5,"feedback":"..."}]\n${JSON.stringify(need)}`}],{max:2500}));
      g.forEach(x=>{const r=res[x.i];if(r){r.s=Math.max(0,Math.min(1,+x.score||0));r.fb=(x.feedback||'')+(r.fb?'\n'+r.fb:'')}});
    }catch(e){toast('تصحیح هوشمند انجام نشد؛ جواب‌های درست رو خودت مقایسه کن',4000)}
  }
  Q.res=res;Q.pct=Math.round(res.reduce((a,r)=>a+r.s,0)/res.length*100);
  Q.qs.forEach((q,i)=>{const k=Q.subject+'|'+(q.topic||'عمومی');const w=S.weak[k]=S.weak[k]||{s:Q.subject,t:q.topic||'عمومی',w:0,n:0};w.n++;if(res[i].s<1)w.w++;else if(w.w>0&&res[i].s===1&&w.n>3)w.w=Math.max(0,w.w-.5)});
  S.quizzes.push({date:today(),subject:Q.subject,pct:Q.pct,n:Q.qs.length});addLog(Math.ceil(Q.qs.length*1.5));save();
  Q.state='done';go('quiz');
}

  qcards:()=>{let n=0;Q.qs.forEach((q,i)=>{if(Q.res[i].s<1){S.cards.push(newCard(Q.subject,q.q,Q.res[i].correct+(q.explain?'\n'+q.explain:'')));n++}});save();toast(n?`${fa(n)} کارت ساخته شد 🃏`:'اشتباهی نداشتی!')},
  weakquiz:()=>{const w=weakList(3);if(!w.length){toast('هنوز ضعفی ثبت نشده؛ اول چند آزمون بده 🙂');return}Q={state:'setup'};tab='quiz';go('quiz');const w0=w[0];startQuiz({subject:w0.s,topic:w.map(x=>x.s+': '+x.t).join('، '),type:'mix',diff:'متوسط',count:8,extra:'روی مباحث ضعف دانش‌آموز تمرکز کن و subject هر سوال را در topic بنویس.'})},
  /* کارت‌ها */
  review:()=>startReview(),
  flip:()=>{R.show=!R.show;go('cards')},
  rate:t=>{const c=R.q.shift(),r=+t.dataset.r;const real=S.cards.find(x=>x.id===c.id);rateCard(real,r);if(r===1)R.q.push(c);else R.n++;R.show=false;addLog(0);save();go('cards')},
  cadd:()=>{const q=$('#mq').value.trim(),a=$('#ma').value.trim();if(!q||!a)return toast('سوال و جواب رو بنویس');S.cards.push(newCard($('#ms').value,q,a));save();go('cards')},
  cdel:t=>{S.cards=S.cards.filter(c=>c.id!==t.dataset.id);save();go('cards')},
  cgen:async t=>{const s=$('#cs').value,tp=$('#ct').value.trim(),n=$('#cn').value;busy(t,true);try{const r=pj(await ai([{role:'user',text:`${n} فلش‌کارت مفید برای مرور درس «${s}» ${tp?'مبحث «'+tp+'»':''} بساز. روی کارت سوال کوتاه و پشتش جواب کوتاه و دقیق. فقط آرایه JSON: [{"q":"...","a":"..."}] بدون LaTeX.`}],{max:3500}));r.filter(x=>x.q&&x.a).forEach(x=>S.cards.push(newCard(s,String(x.q),String(x.a))));save();toast('کارت‌ها ساخته شد ✅');go('cards')}catch(e){toast(aiErr(e),4500)}busy(t,false)},
  /* جزوه */
  nimgpick:async()=>{const i=await pickImage();if(i){nImg=i;$('#nimg').innerHTML=`<img src="${i.url}" style="height:60px;border-radius:8px">`}},
  nmode:t=>{nMode=t.dataset.v;document.querySelectorAll('[data-a=nmode]').forEach(x=>x.classList.toggle('on',x===t))},
  nrun:async t=>{const txt=$('#nt').value.trim();if(!txt&&!nImg)return toast('متن یا عکس جزوه رو بده');busy(t,true);
    const ask={خلاصه:'یک خلاصه منظم و کوتاه',['نکات کلیدی']:'نکات کلیدی و فرمول‌های مهم به‌صورت فهرست',['نمونه‌سوال']:'۵ نمونه‌سوال (ترکیبی) همراه با پاسخ کوتاه',['آموزش ساده']:'یک آموزش ساده و گام‌به‌گام با مثال'}[nMode];
    try{const r=await ai([{role:'user',text:`درس: ${$('#ns').value}. از روی این جزوه ${ask} بنویس.\n\n${txt}`,img:nImg}],{max:3000});nOut=r;$('#nout').innerHTML=`<div class="out">${md(r)}</div><button class="btn sec full" style="margin-top:8px" data-a="ncards">🃏 ساخت فلش‌کارت از این</button>`}catch(e){toast(aiErr(e),4500)}busy(t,false)},
  ncards:async t=>{busy(t,true);try{const s=$('#ns').value;const r=pj(await ai([{role:'user',text:`از این متن ۸ فلش‌کارت بساز. فقط آرایه JSON: [{"q":"...","a":"..."}]\n\n${nOut}`}],{max:3000}));r.filter(x=>x.q&&x.a).forEach(x=>S.cards.push(newCard(s,String(x.q),String(x.a))));save();toast('کارت‌ها اضافه شد ✅')}catch(e){toast(aiErr(e),4500)}busy(t,false)},
  /* برنامه */
  eadd:()=>{const d=$('#ed').value;if(!d)return toast('تاریخ رو انتخاب کن');S.exams.push({id:uid(),subject:$('#es').value,date:d});save();go('plan')},
  edel:t=>{S.exams=S.exams.filter(e=>e.id!==t.dataset.id);save();go('plan')},
  notif:async t=>{S.notify=t.checked;if(t.checked){try{const p=await Notification.requestPermission();if(p!=='granted')toast('اجازه اعلان داده نشد')}catch(e){}}save()},
  pgen:async t=>{S.hours=+$('#ph').value||3;busy(t,true);const td=today();
    const ex=S.exams.filter(e=>e.date>=td).map(e=>({subject:e.subject,date:e.date}));
    const w=weakList(5).map(x=>x.s+': '+x.t);
    try{const r=pj(await ai([{role:'user',text:`یک برنامه مطالعه برای ۷ روز آینده بساز. امروز ${td} است (${pf(td)}). تاریخ‌ها را میلادی به‌صورت YYYY-MM-DD بنویس، از امروز شروع کن.
درس‌های دانش‌آموز: ${SUBJECTS.join('، ')}.
امتحان‌ها: ${JSON.stringify(ex)}. مباحث ضعیف: ${JSON.stringify(w)}.
هر روز حدود ${S.hours} ساعت (مجموع minutes هر روز). درس‌های نزدیک‌ترین امتحان و ضعف‌ها اولویت بیشتر دارند، درس‌های اصلی (ریاضی، فیزیک، شیمی، زیست، هندسه) را متوازن بچین و از تکرار یک درس در کل روز بپرهیز. topic باید مبحث مشخصی از کتاب باشد.
فقط آرایه JSON: [{"date":"YYYY-MM-DD","subject":"...","topic":"...","minutes":45}]`}],{max:4000}));
      const ok=r.filter(x=>x.date&&x.subject&&x.topic&&x.minutes).map(x=>({id:uid(),date:x.date,subject:String(x.subject),topic:String(x.topic),minutes:Math.round(+x.minutes)||30,done:false}));
      if(!ok.length)throw new Error('برنامه‌ای ساخته نشد');
      S.plan=S.plan.filter(p=>p.date<td).concat(ok);save();toast('برنامه آماده شد 📅');go('plan')}catch(e){toast(aiErr(e),4500)}busy(t,false)}
};
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t||t.tagName==='INPUT'&&t.type==='checkbox'&&e.type==='click'&&false)return;if(t.tagName==='SELECT'||(t.tagName==='INPUT'&&t.type==='checkbox'))return;A[t.dataset.a]?.(t,e)});
document.addEventListener('change',e=>{const t=e.target.closest('[data-a]');if(t&&(t.tagName==='SELECT'||(t.tagName==='INPUT'&&t.type==='checkbox')))A[t.dataset.a]?.(t,e)});

/* ============ شروع ============ */
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
go('home');
if(S.notify){const n=S.plan.filter(p=>p.date===today()&&!p.done).length,d=dueCards().length;if((n||d)&&window.Notification&&Notification.permission==='granted'){try{new Notification('یار درسی 📚',{body:`امروز ${fa(n)} کار برنامه و ${fa(d)} کارت برای مرور داری`})}catch(e){}}}
</script>
</body>
