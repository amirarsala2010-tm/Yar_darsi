<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>یار درسی</title>
<style>
:root{--acc:#6366f1;--acc2:#8b5cf6;--bg:#0b1020;--card:#151b2e;--card2:#1d2540;--tx:#eef1fb;--mut:#8f9ab8;--bd:#273052;--ok:#22c55e;--bad:#ef4444;--warn:#f59e0b;--warnbg:#3a2a0a;--warntx:#fde68a;--sh:0 6px 24px #0006;--fs:15px;color-scheme:dark}
html[data-mode=light]{--bg:#f3f5fb;--card:#fff;--card2:#eef1fa;--tx:#171c33;--mut:#66708f;--bd:#dde2f1;--warnbg:#fff4d6;--warntx:#7a4d00;--sh:0 4px 18px #1b254a1f;color-scheme:light}
@media(prefers-color-scheme:light){html[data-mode=auto]{--bg:#f3f5fb;--card:#fff;--card2:#eef1fa;--tx:#171c33;--mut:#66708f;--bd:#dde2f1;--warnbg:#fff4d6;--warntx:#7a4d00;--sh:0 4px 18px #1b254a1f;color-scheme:light}}
html[data-accent=emerald]{--acc:#10b981;--acc2:#06b6d4}
html[data-accent=rose]{--acc:#f43f5e;--acc2:#f97316}
html[data-accent=amber]{--acc:#f59e0b;--acc2:#ef4444}
html[data-accent=sky]{--acc:#0ea5e9;--acc2:#6366f1}
html[data-accent=violet]{--acc:#a855f7;--acc2:#ec4899}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:var(--fs)}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:Vazirmatn,Tahoma,"Segoe UI",system-ui,sans-serif;line-height:1.7}
body{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
.ic{display:block;flex:none}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top));background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;box-shadow:var(--sh)}
header .logo{width:34px;height:34px;border-radius:10px;overflow:hidden;flex:none;box-shadow:0 2px 8px #0004}
header h1{flex:1;margin:0;font-size:1.15rem}
header button{background:#ffffff2b;border:0;color:#fff;border-radius:12px;width:38px;height:38px;display:grid;place-items:center;cursor:pointer}
main{padding:14px;max-width:720px;margin:auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:var(--sh)}
.card h3{margin:0 0 8px;font-size:1.05rem;display:flex;align-items:center;gap:6px}
.row{display:flex;gap:8px;align-items:center}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{grid-template-columns:repeat(3,1fr)}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:10px 6px;text-align:center;box-shadow:var(--sh)}
.stat b{display:block;font-size:1.35rem}
.stat small,.mut{color:var(--mut);font-size:.84rem}
.btn{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;border:0;border-radius:13px;padding:10px 14px;font:inherit;font-weight:700;cursor:pointer}
.btn.sec{background:var(--card2);color:var(--tx);border:1px solid var(--bd);font-weight:500}
.btn.sm{padding:5px 10px;font-size:.85rem;border-radius:10px}
.btn.full{width:100%}
.btn:disabled{opacity:.5}
.btn.red{background:#b91c1c;color:#fff}
.q{display:block;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px 8px;text-align:center;color:var(--tx);font:inherit;cursor:pointer;box-shadow:var(--sh)}
.q .qi{width:46px;height:46px;border-radius:14px;margin:0 auto 6px;display:grid;place-items:center;background:color-mix(in srgb,var(--acc) 16%,transparent);color:var(--acc)}
input,select,textarea{width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:12px;padding:10px;font:inherit;margin:4px 0}
input:focus,select:focus,textarea:focus{outline:2px solid color-mix(in srgb,var(--acc) 55%,transparent);outline-offset:0}
textarea{min-height:90px;resize:vertical}
label{font-size:.85rem;color:var(--mut)}
nav{position:fixed;bottom:0;inset-inline:0;z-index:6;display:flex;background:var(--card);border-top:1px solid var(--bd);padding:4px 4px env(safe-area-inset-bottom);box-shadow:0 -4px 20px #0003}
nav button{flex:1;background:none;border:0;color:var(--mut);padding:4px 2px;font:inherit;font-size:.72rem;cursor:pointer}
nav .ico{display:grid;place-items:center;width:54px;height:30px;margin:0 auto 2px;border-radius:99px;transition:.2s}
nav button.on{color:var(--acc);font-weight:700}
nav button.on .ico{background:color-mix(in srgb,var(--acc) 18%,transparent)}
.msgs{display:flex;flex-direction:column;gap:8px;min-height:40vh;max-height:55vh;overflow-y:auto;padding:4px}
.m{max-width:88%;padding:9px 12px;border-radius:16px;word-wrap:break-word;overflow-wrap:anywhere}
.m.u{align-self:flex-start;background:var(--acc);color:#fff;border-bottom-right-radius:4px}
.m.a{align-self:flex-end;background:var(--card2);border-bottom-left-radius:4px}
.m img{max-width:100%;border-radius:10px;display:block;margin-bottom:6px}
.m pre,.out pre{direction:ltr;text-align:left;background:var(--bg);padding:8px;border-radius:8px;overflow-x:auto;white-space:pre-wrap}
code{background:var(--bg);padding:1px 5px;border-radius:5px;direction:ltr;unicode-bidi:embed}
.li{padding-inline-start:4px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chip{background:var(--card2);border:1px solid var(--bd);color:var(--tx);border-radius:999px;padding:4px 12px;font:inherit;font-size:.85rem;cursor:pointer}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.opt{display:block;width:100%;text-align:start;background:var(--card2);border:2px solid var(--bd);color:var(--tx);border-radius:12px;padding:10px;margin:6px 0;font:inherit;cursor:pointer}
.opt.sel{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 18%,transparent)}
.ok{border-color:var(--ok)!important}
.no{border-color:var(--bad)!important}
.bar{height:8px;background:var(--card2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));border-radius:99px}
.flash{min-height:180px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:1.2rem;background:var(--card2);border-radius:16px;padding:16px;margin:10px 0}
.task{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--bd)}
.task:last-child{border:0}
.task input{width:22px;height:22px;margin:0;accent-color:var(--acc)}
.task.done span{text-decoration:line-through;color:var(--mut)}
.tag{display:inline-block;background:color-mix(in srgb,var(--acc) 16%,transparent);border-radius:8px;padding:0 8px;font-size:.8rem;color:var(--acc)}
.toast{position:fixed;bottom:92px;inset-inline:16px;z-index:20;background:var(--card);color:var(--tx);border:1px solid var(--acc);border-radius:14px;padding:10px 14px;text-align:center;box-shadow:var(--sh)}
.ov{position:fixed;inset:0;background:#000b;z-index:15;display:flex;align-items:center;justify-content:center;padding:16px}
.ov .card{width:100%;max-width:420px;max-height:90vh;overflow:auto;margin:0}
.timer{font-size:3.6rem;font-weight:800;text-align:center;direction:ltr;font-variant-numeric:tabular-nums}
.spin{display:inline-block;width:16px;height:16px;border:3px solid #fff5;border-top-color:#fff;border-radius:50%;animation:r .8s linear infinite;vertical-align:middle}
@keyframes r{to{transform:rotate(360deg)}}
.warn{background:var(--warnbg);border-color:var(--warn)}
.warn .wtx{color:var(--warntx)}
.out{background:var(--card2);border-radius:12px;padding:12px;margin-top:10px}
svg text{fill:var(--mut);font-size:11px;font-family:inherit}
.hero{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;border-radius:22px;padding:16px;margin-bottom:12px;display:flex;align-items:center;gap:14px;box-shadow:var(--sh);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset-inline-end:-40px;top:-60px;width:170px;height:170px;border-radius:50%;background:#ffffff14}
.hero>div{position:relative;z-index:1}
.hero h2{margin:0;font-size:1.2rem}
.hero p{margin:2px 0 8px;opacity:.92;font-size:.88rem}
.pill{display:inline-flex;align-items:center;gap:4px;background:#ffffff2e;border-radius:99px;padding:2px 10px;font-size:.82rem}
.ring{width:104px;height:104px;flex:none;position:relative;z-index:1}
.big{font-size:2.6rem;font-weight:800;line-height:1.1}
.prog{display:flex;align-items:center;gap:10px;margin:8px 0}
.prog span:first-child{width:92px;font-size:.85rem;flex:none}
.prog .bar{flex:1}
.prog small{width:48px;text-align:end;color:var(--mut)}
.seg{display:flex;background:var(--card2);border-radius:13px;padding:3px;gap:3px;margin-top:4px}
.seg button{flex:1;border:0;background:none;color:var(--mut);padding:7px 4px;border-radius:10px;font:inherit;font-size:.85rem;cursor:pointer}
.seg button.on{background:var(--card);color:var(--tx);box-shadow:var(--sh);font-weight:700}
.sw{position:relative;display:inline-block;width:46px;height:26px;flex:none}
.sw input{opacity:0;width:100%;height:100%;position:absolute;margin:0;z-index:1;cursor:pointer}
.sw i{position:absolute;inset:0;background:var(--bd);border-radius:99px;transition:.2s}
.sw i::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.sw input:checked+i{background:var(--acc)}
.sw input:checked+i::after{inset-inline-start:23px}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0}
.swatches{display:flex;gap:12px;flex-wrap:wrap;margin-top:6px}
.swatch{width:36px;height:36px;border-radius:50%;border:3px solid transparent;cursor:pointer;padding:0;box-shadow:0 0 0 1px var(--bd)}
.swatch.on{border-color:var(--card);box-shadow:0 0 0 3px var(--tx)}
.sect{display:flex;align-items:center;gap:8px;color:var(--mut);font-size:.85rem;margin:18px 4px 8px;font-weight:700}
.sect .ic{margin:0}
.avatar{width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--acc),var(--acc2));display:grid;place-items:center;font-size:1.5rem;font-weight:800;color:#fff;flex:none}
</style>
</head>
<body>
<header><div class="logo"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="34" height="34"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4f46e5"/><stop offset="1" stop-color="#a855f7"/></linearGradient><linearGradient id="pg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#dfe3ff"/></linearGradient></defs><rect width="512" height="512" fill="url(#bg)"/><circle cx="410" cy="96" r="150" fill="#ffffff" opacity=".07"/><g transform="translate(0,24)"><path d="M256 372C222 342 164 332 112 344V204C164 192 222 202 256 232Z" fill="url(#pg)"/><path d="M256 372C290 342 348 332 400 344V204C348 192 290 202 256 232Z" fill="#ffffff" opacity=".88"/><path d="M256 232V372" stroke="#6d5ee8" stroke-width="6" stroke-linecap="round" opacity=".5"/><path d="M142 232c26-4 56 0 86 14M142 262c26-4 56 0 86 14" stroke="#6d5ee8" stroke-width="7" stroke-linecap="round" opacity=".35" fill="none"/><path d="M370 232c-26-4-56 0-86 14M370 262c-26-4-56 0-86 14" stroke="#6d5ee8" stroke-width="7" stroke-linecap="round" opacity=".3" fill="none"/><path d="M256 92L271 134L313 149L271 164L256 206L241 164L199 149L241 134Z" fill="#fbbf24"/><circle cx="326" cy="112" r="9" fill="#fde68a"/><circle cx="188" cy="118" r="6" fill="#fde68a" opacity=".8"/></g></svg></div><h1 id="ttl">یار درسی</h1><button id="hb1" data-a="pomo" aria-label="تایمر تمرکز"></button><button id="hb2" data-a="settings" aria-label="تنظیمات"></button></header>
<main id="app"></main>
<nav id="nav"></nav>
<input type="file" id="file" accept="image/*" hidden>
<script>
/* ============ ابزارها ============ */
const $=(s,r=document)=>r.querySelector(s);
const fa=n=>Number(n).toLocaleString('fa-IR');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const iso=d=>d.toLocaleDateString('sv-SE');
const today=()=>iso(new Date());
const fromIso=s=>new Date(s+'T12:00:00');
const addDays=(s,n)=>{const d=fromIso(s);d.setDate(d.getDate()+n);return iso(d)};
const pf=(s,o={weekday:'long',day:'numeric',month:'long'})=>new Intl.DateTimeFormat('fa-IR-u-ca-persian',o).format(typeof s==='string'?fromIso(s):s);
const uid=()=>Math.random().toString(36).slice(2,9);
const ICON={
home:'<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/>',
tutor:'<path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11v5c3 2.5 9 2.5 12 0v-5"/><path d="M22 9v6"/>',
quiz:'<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 14l2 2 4-4"/>',
cards:'<path d="M12 3l9 5-9 5-9-5z"/><path d="M3 12.5l9 5 9-5"/><path d="M3 17l9 5 9-5"/>',
plan:'<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/>',
stats:'<path d="M5 21V10M12 21V4M19 21v-7"/>',
timer:'<circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9 2h6"/>',
settings:'<path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/>',
notes:'<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/>',
target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5"/>',
refresh:'<path d="M20 11a8 8 0 0 0-14-4M4 4v4h4M4 13a8 8 0 0 0 14 4M20 20v-4h-4"/>',
flame:'<path d="M12 3c1 4 5 5 5 10a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3-1-5 1-9z"/>',
palette:'<circle cx="12" cy="12" r="9"/><circle cx="8" cy="11" r="1"/><circle cx="12" cy="7.5" r="1"/><circle cx="16" cy="11" r="1"/>',
sparkles:'<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 17v4M17 19h4"/>',
data:'<ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>',
book:'<path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 21V5"/>',
user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',
hourglass:'<path d="M6 3h12M6 21h12M7 3c0 5 5 6 5 9s-5 4-5 9M17 3c0 5-5 6-5 9s5 4 5 9"/>'
};
const ic=(n,s=22)=>`<svg class="ic" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${ICON[n]||''}</svg>`;
const act=()=>(typeof S!=='undefined'&&S&&S.subjects&&S.subjects.length)?S.subjects:SUBJECTS;

const SUBJECTS=['ریاضی ۱','هندسه ۱','فیزیک ۱','شیمی ۱','زیست‌شناسی ۱','فارسی ۱','نگارش ۱','عربی ۱','زبان انگلیسی ۱','دین و زندگی ۱','آمادگی دفاعی','سلامت و بهداشت','تفکر و سواد رسانه‌ای','کارگاه کارآفرینی و تولید'];
const subjOpts=(sel,all)=>(all?'<option value="">همه درس‌ها</option>':'')+act().map(s=>`<option ${s===sel?'selected':''}>${s}</option>`).join('');
function md(t){t=esc(t);t=t.replace(/```(?:\w+)?\n?([\s\S]*?)```/g,'<pre>$1</pre>').replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/^#{1,4}\s*(.+)$/gm,'<b>$1</b>').replace(/^\s*[-*•]\s+(.+)$/gm,'<div class="li">• $1</div>').replace(/\n/g,'<br>').replace(/<\/div><br>/g,'</div>');return t}
function pj(t){const a=t.search(/[\[{]/);const b=Math.max(t.lastIndexOf(']'),t.lastIndexOf('}'));if(a<0||b<a)throw new Error('پاسخ هوش مصنوعی قابل خواندن نبود، دوباره امتحان کن');return JSON.parse(t.slice(a,b+1))}
function toast(m,ms=2600){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),ms)}

/* ============ ذخیره‌سازی ============ */
const KEY='yar_darsi_v1';
const DEF={name:'',cfg:{provider:'anthropic',key:'',base:'https://api.openai.com/v1',model:'claude-sonnet-5-5'},chat:{},cards:[],exams:[],plan:[],quizzes:[],weak:{},log:{},hours:3,notify:false,mode:'auto',accent:'indigo',fs:15,goal:60,tone:'دوستانه',len:'متوسط',subjects:SUBJECTS.slice(),subjLog:{}};
let S;
try{S=Object.assign({},DEF,JSON.parse(localStorage.getItem(KEY)||'{}'));S.cfg=Object.assign({},DEF.cfg,S.cfg)}catch(e){S=structuredClone(DEF)}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('حافظه پر است')}};

/* ============ هوش مصنوعی ============ */
const SYS_BASE=`تو «یار درسی»، معلم خصوصی مهربان و دقیق یک دانش‌آموز پایه دهم رشته ریاضی فیزیک در ایران هستی. بر اساس کتاب‌های درسی رسمی ایران پاسخ بده. فارسی ساده و دوستانه بنویس. مرحله‌به‌مرحله توضیح بده و کوتاه و مفید باش. فرمول‌ها را با متن ساده و نمادهای یونیکد بنویس (مثل x² ، √ ، ½ ، Δ ، ×) و هرگز از LaTeX یا علامت $ استفاده نکن. اگر از درستی چیزی مطمئن نیستی، صادقانه بگو.`;
function sys(){const t={'دوستانه':'لحن گرم، دوستانه و تشویق‌کننده داشته باش.','جدی':'لحن جدی، رسمی و کاملاً علمی داشته باش.','انگیزشی':'لحن انگیزشی و پرانرژی داشته باش و دانش‌آموز را تشویق کن.'}[S.tone]||'';const l={'کوتاه':'جواب‌ها را بسیار کوتاه و فشرده بنویس.','مفصل':'جواب‌ها را کامل و مفصل همراه با مثال بنویس.'}[S.len]||'';return SYS_BASE+' '+t+' '+l}
async function ai(msgs,{system=sys(),max=2500}={}){
  const c=S.cfg;if(!c.key)throw new Error('NOKEY');
  if(c.provider==='anthropic'){
    const m=msgs.map(x=>({role:x.role,content:x.img?[{type:'image',source:{type:'base64',media_type:x.img.type,data:x.img.data}},{type:'text',text:x.text||'این تصویر را بررسی کن.'}]:x.text}));
    const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':c.key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:c.model,max_tokens:max,system,messages:m})});
    const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error?.message||('خطا '+r.status));
    return (j.content||[]).map(b=>b.text||'').join('');
  }
  const m=[{role:'system',content:system},...msgs.map(x=>({role:x.role,content:x.img?[{type:'text',text:x.text||'این تصویر را بررسی کن.'},{type:'image_url',image_url:{url:x.img.url}}]:x.text}))];
  const r=await fetch(c.base.replace(/\/$/,'')+'/chat/completions',{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+c.key},body:JSON.stringify({model:c.model,max_tokens:max,messages:m})});
  const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error?.message||('خطا '+r.status));
  return j.choices?.[0]?.message?.content||'';
}

function rateCard(c,r){

/* ---- آمار ---- */
V.stats=()=>{
  const t=today(),ds=[...Array(7)].map((_,i)=>addDays(t,i-6)),mx=Math.max(30,...ds.map(d=>S.log[d]||0));
  const bars=ds.map((d,i)=>{const h=(S.log[d]||0)/mx*110,x=12+i*46;return `<rect x="${x}" y="${130-h}" width="30" height="${h}" rx="6" fill="#6366f1"/><text x="${x+15}" y="146" text-anchor="middle">${pf(d,{weekday:'narrow'})}</text><text x="${x+15}" y="${125-h}" text-anchor="middle">${S.log[d]?fa(S.log[d]):''}</text>`}).join('');
  const total=Object.values(S.log).reduce((a,b)=>a+b,0),w=weakList(6),qs=S.quizzes.slice(-8);
  const avg=S.quizzes.length?Math.round(S.quizzes.reduce((a,q)=>a+q.pct,0)/S.quizzes.length):0;
  const pts=qs.map((q,i)=>`${15+i*(qs.length>1?290/(qs.length-1):0)},${100-q.pct*.9}`).join(' ');
  return `<div class="grid g3" style="margin-bottom:12px"><div class="stat"><b>${fa(Math.round(total/60*10)/10)}</b><small>ساعت مطالعه</small></div><div class="stat"><b>${fa(streak())}</b><small>روز پیاپی</small></div><div class="stat"><b>${fa(avg)}٪</b><small>میانگین آزمون</small></div></div>
  <div class="card"><h3>مطالعه ۷ روز اخیر (دقیقه)</h3><svg viewBox="0 0 330 155" width="100%">${bars}</svg></div>
  <div class="card"><h3>روند نمره آزمون‌ها</h3>${qs.length>1?`<svg viewBox="0 0 330 110" width="100%"><polyline points="${pts}" fill="none" stroke="#8b5cf6" stroke-width="3"/>${qs.map((q,i)=>`<circle cx="${15+i*290/(qs.length-1)}" cy="${100-q.pct*.9}" r="4" fill="#a5b4fc"/>`).join('')}</svg>`:'<div class="mut">حداقل دو آزمون بده تا نمودار بیاد.</div>'}</div>
  <div class="card"><h3>🎯 مباحث ضعیف تو</h3>${w.length?w.map(x=>`<div class="row" style="justify-content:space-between;margin:4px 0"><span><span class="tag">${esc(x.s)}</span> ${esc(x.t)}</span><span class="mut">${fa(x.w)} اشتباه از ${fa(x.n)}</span></div>`).join('')+`<button class="btn full" style="margin-top:8px" data-a="weakquiz">تمرین همین ضعف‌ها</button>`:'<div class="mut">بعد از چند آزمون، ضعف‌هات اینجا پیدا می‌شن.</div>'}</div>`;
};

function setS(p,v){const k=p.split('.');let o=S;while(k.length>1)o=o[k.shift()];o[k[0]]=typeof v==='string'?v.trim():v;save()}
function applyTheme(){const h=document.documentElement;h.dataset.mode=S.mode;h.dataset.accent=S.accent;h.style.setProperty('--fs',S.fs+'px');const m=document.querySelector('meta[name=theme-color]');if(m)m.content=ACC[S.accent]?ACC[S.accent][0]:'#6366f1'}
function hdr(){$('#hb1').innerHTML=ic('timer',20);$('#hb2').innerHTML=ic('settings',20)}

const rs=()=>{const y=scrollY;go('settings');scrollTo(0,y)};

<div class="chips">${[30,60,90,120,180].map(m=>`<button class="chip ${+S.goal===m?'on':''}" data-a="setgoal" data-v="${m}">${fa(m)}</button>`).join('')}</div>

<div class="sect">${ic('data',18)} داده‌ها</div>

<div class="mut" style="text-align:center;margin-top:8px">یار درسی · نسخه ۲</div>`};
let P=null,PI=null;
function pomo(){
  if(P){pomoDraw();return}
  overlay(`<h3>⏱ تایمر تمرکز</h3><label>درس</label><select id="ps">${subjOpts('ریاضی ۱')}</select><label>مدت (دقیقه)</label><div class="chips">${[15,25,45,60].map(m=>`<button class="chip ${m===25?'on':''}" data-a="pmin" data-m="${m}">${fa(m)}</button>`).join('')}</div><button class="btn full" data-a="pstart">شروع</button><button class="btn sec full" style="margin-top:8px" data-a="closeov">بستن</button>`);
}
let pm=25;
function pomoDraw(){
  overlay(`<h3 style="text-align:center">${esc(P.subject)}</h3><div class="timer" id="pt">--:--</div><div class="bar" style="margin:10px 0"><i id="pb" style="width:0"></i></div><p class="mut" style="text-align:center">گوشی رو بذار کنار و تمرکز کن 🎯</p><button class="btn red full" data-a="pstop">انصراف</button><button class="btn sec full" style="margin-top:8px" data-a="closeov">پنهان کردن</button>`);
  tick();
}
function tick(){
  if(!P)return;const left=Math.max(0,P.end-Date.now()),s=Math.ceil(left/1000);
  const t=$('#pt');if(t)t.textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
  const b=$('#pb');if(b)b.style.width=(100-left/(P.mins*60000)*100)+'%';
  if(left<=0){clearInterval(PI);addLog(P.mins,P.subject);save();navigator.vibrate?.([300,150,300]);toast(`✅ ${fa(P.mins)} دقیقه تمرکز ثبت شد، آفرین!`,5000);try{if(Notification.permission==='granted')new Notification('یار درسی',{body:'زمان تمرکز تمام شد! استراحت کن ☕'})}catch(e){}P=null;closeOv();go(tab)}
}
